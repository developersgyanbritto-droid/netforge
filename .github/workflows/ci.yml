name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: netforge, POSTGRES_PASSWORD: netforge, POSTGRES_DB: netforge }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U netforge" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://netforge:netforge@localhost:5433/netforge?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
      - run: pnpm --filter @netforge/api exec prisma migrate deploy
      - run: pnpm --filter @netforge/api db:seed
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @netforge/web build
      - run: pnpm --filter @netforge/api build
      # E2E: start both servers, then run Playwright
      - run: pnpm --filter @netforge/web exec playwright install --with-deps chromium
      - run: |
          (cd apps/api && node dist/server.js &) 
          (cd apps/web && npx next start --port 3000 &)
          npx wait-on http://localhost:3000/api/v1/health
          pnpm --filter @netforge/web e2e
        env: { API_URL: "http://127.0.0.1:4000", APP_ORIGINS: "http://localhost:3000" }
