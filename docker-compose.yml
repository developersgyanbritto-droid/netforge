services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: netforge
      POSTGRES_PASSWORD: netforge
      POSTGRES_DB: netforge
    ports:
      - "5433:5432"
    volumes:
      - netforge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netforge"]
      interval: 5s
      retries: 10
volumes:
  netforge_pg:
